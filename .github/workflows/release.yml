name: Release WORM CLI

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta.*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify bundled parser catalog matches shipped packs
        run: go run ./cmd/marketplace -check-packs packs
      - name: Build embedded UI
        run: |
          npm ci --prefix web
          npm run build --prefix web
      - name: Run Go checks
        run: |
          go vet ./...
          go test -count=1 ./...
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 1

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist/
      - name: Build versioned archive
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]] || { echo 'Tag must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-beta.NUMBER' >&2; exit 1; }
          os='${{ matrix.goos }}'
          arch='${{ matrix.goarch }}'
          stage="dist/${tag}/worm-${tag}-${os}-${arch}"
          mkdir -p "$stage"
          suffix=''
          if [[ "$os" == windows ]]; then suffix='.exe'; fi
          go build -trimpath -ldflags="-s -w -X 'main.Version=${tag}'" -o "$stage/worm$suffix" ./cmd/worm
          cp -R packs schemas sources sinks "$stage/"
          tar -czf "$stage.tar.gz" -C "$stage" .
      - name: Verify version flag on Linux amd64
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        shell: bash
        run: |
          expected="WORM CLI Version: $GITHUB_REF_NAME"
          actual="$(dist/${GITHUB_REF_NAME}/worm-${GITHUB_REF_NAME}-linux-amd64/worm --version)"
          [[ "$actual" == "$expected" ]] || { echo "Expected '$expected', got '$actual'" >&2; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: worm-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ github.ref_name }}/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: worm-*
          path: dist/${{ github.ref_name }}/
          merge-multiple: true
      - name: Create checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/${GITHUB_REF_NAME}/*.tar.gz)
          [[ ${#archives[@]} -eq 6 ]] || { echo "Expected 6 archives, found ${#archives[@]}" >&2; exit 1; }
          (cd "dist/${GITHUB_REF_NAME}" && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" =~ -beta\.[0-9]+$ ]]; then
            gh release create "$tag" "dist/$tag"/*.tar.gz "dist/$tag/SHA256SUMS" \
              --verify-tag --prerelease --title "$tag (beta)" \
              --notes "This beta release is not yet fully working. Please refer to the non-beta version only."
          else
            gh release create "$tag" "dist/$tag"/*.tar.gz "dist/$tag/SHA256SUMS" \
              --verify-tag --generate-notes
          fi
