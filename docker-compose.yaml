name: worm-simulation

services:
  # Core Universal Log Pre-processing Framework (WORM)
  worm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worm-core
    ports:
      - "514:514/udp"
      - "514:514/tcp"
      - "8080:8080/tcp"
      - "9090:9090/tcp"
    volumes:
      - ./data/worm.db:/data/worm.db
      - ./data/inbox:/data/inbox
      - ./data/output:/data/output
      - ./packs:/worm/packs:ro
    environment:
      - WORM_LOG_LEVEL=info
    restart: unless-stopped
    networks:
      - worm-net

  # 1. Simulates Palo Alto Firewall sending Syslog UDP
  sim-firewall:
    build:
      context: .
      dockerfile: docker/sim/Dockerfile
    container_name: sim-firewall
    command: ["--source", "firewall", "--scenario", "mixed", "--format", "syslog-udp", "--target", "worm:514", "--rate", "2", "--count", "0"]
    depends_on:
      - worm
    restart: unless-stopped
    networks:
      - worm-net

  # 2. Simulates Cisco ASA Firewall sending Syslog UDP
  sim-asa:
    build:
      context: .
      dockerfile: docker/sim/Dockerfile
    container_name: sim-asa
    command: ["--source", "asa", "--scenario", "mixed", "--format", "syslog-udp", "--target", "worm:514", "--rate", "2", "--count", "0"]
    depends_on:
      - worm
    restart: unless-stopped
    networks:
      - worm-net

  # 3. Simulates Linux SSHD / auth.log streaming Syslog TCP
  sim-sshd:
    build:
      context: .
      dockerfile: docker/sim/Dockerfile
    container_name: sim-sshd
    command: ["--source", "sshd", "--scenario", "bruteforce", "--format", "syslog-tcp", "--target", "worm:514", "--rate", "1", "--count", "0"]
    depends_on:
      - worm
    restart: unless-stopped
    networks:
      - worm-net

  # 4. Simulates Suricata/Snort IDS alerts in CEF over Syslog UDP
  sim-ids:
    build:
      context: .
      dockerfile: docker/sim/Dockerfile
    container_name: sim-ids
    command: ["--source", "ids", "--scenario", "scan", "--format", "syslog-udp", "--target", "worm:514", "--rate", "1", "--count", "0"]
    depends_on:
      - worm
    restart: unless-stopped
    networks:
      - worm-net

  # 5. Simulates Nginx Web Server writing Combined Log Format to spool inbox
  sim-webserver:
    build:
      context: .
      dockerfile: docker/sim/Dockerfile
    container_name: sim-webserver
    command: ["--source", "webserver", "--scenario", "mixed", "--format", "file", "--output-dir", "/data/inbox", "--rate", "2", "--count", "0"]
    volumes:
      - ./data/inbox:/data/inbox
    depends_on:
      - worm
    restart: unless-stopped
    networks:
      - worm-net

  # 6. Simulates Payment Gateway microservice posting JSON events via HTTP REST
  sim-app:
    build:
      context: .
      dockerfile: docker/sim/Dockerfile
    container_name: sim-app
    command: ["--source", "app", "--scenario", "mixed", "--format", "http-post", "--target", "http://worm:8080/api/v1/ingest", "--rate", "4", "--count", "0"]
    depends_on:
      - worm
    restart: unless-stopped
    networks:
      - worm-net

  # 7. Simulates Database Server generating CSV audit logs into spool inbox
  sim-database:
    build:
      context: .
      dockerfile: docker/sim/Dockerfile
    container_name: sim-database
    command: ["--source", "database", "--scenario", "mixed", "--format", "file", "--output-dir", "/data/inbox", "--rate", "1", "--count", "0"]
    volumes:
      - ./data/inbox:/data/inbox
    depends_on:
      - worm
    restart: unless-stopped
  # 8. Web-based SQLite GUI Viewer
  sqlite-web:
    build:
      context: .
      dockerfile: docker/sqlite-web/Dockerfile
    container_name: worm-sqlite-web
    ports:
      - "8085:8080/tcp"
    volumes:
      - ./data:/data:ro
    restart: unless-stopped
    networks:
      - worm-net

networks:
  worm-net:
    driver: bridge
