apiVersion: worm.io/v1
kind: LogSource
metadata:
  name: market-001-panos-traffic
  version: 1.0.0
  description: "Local parser profile for source inventory entry 1: Palo Alto Networks PAN-OS NGFW, PA-Series/VM-Series; Traffic CSV over syslog; explicit custom syslog CSV profile; see fixture note"
  author: WORM Owner
spec:
  sourceCategory: network_device
  format: syslog
  match:
    contains: ",443,tcp,all"
    regex: '^\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2},[^\"]*("[^\"]*"[^\"]*)*$'
  fields:
    event_message:
      from: "message"
      type: string
  map:
    event_message: event.message
  preserveUnmapped: true
