apiVersion: worm.io/v1
kind: LogSource
metadata:
  name: market-013-cisco-ftd-connection
  version: 1.0.0
  description: "Local parser profile for source inventory entry 13: Cisco Secure Firewall Threat Defense 7.x; connection syslog"
  author: WORM Owner
spec:
  sourceCategory: endpoint
  format: syslog
  match:
    contains: "FTD-6-430002"
  fields:
    event_message:
      from: "message"
      type: string
  map:
    event_message: event.message
  preserveUnmapped: true
