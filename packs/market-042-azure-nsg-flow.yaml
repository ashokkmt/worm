apiVersion: worm.io/v1
kind: LogSource
metadata:
  name: market-042-azure-nsg-flow
  version: 1.0.0
  description: "Local parser profile for source inventory entry 42: Azure Network Watcher NSG Flow Logs v2; nested JSON with comma-separated flow tuples"
  author: WORM Owner
spec:
  sourceCategory: cloud
  format: json
  match:
    contains: "\"flows\":"
  fields:
    sample_validation_42:
      from: "records.0.time"
      type: timestamp
      required: true
  preserveUnmapped: true
