apiVersion: worm.io/v1
kind: LogSource
metadata:
  name: market-048-apache-error
  version: 1.0.0
  description: "Local parser profile for source inventory entry 48: Apache HTTP Server 2.4; error log text (combined access format overlaps NGINX entry 39)"
  author: WORM Owner
spec:
  sourceCategory: server
  format: text
  match:
    contains: "1234:tid"
    regex: '^\[[A-Z][a-z]{2} [A-Z][a-z]{2} +\d{1,2} \d{2}:\d{2}:\d{2}\.\d+ \d{4}\]'
  fields:
    event_message:
      from: "message"
      type: string
  map:
    event_message: event.message
  preserveUnmapped: true
