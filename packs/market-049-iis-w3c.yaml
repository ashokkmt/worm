apiVersion: worm.io/v1
kind: LogSource
metadata:
  name: market-049-iis-w3c
  version: 1.0.0
  description: "Local parser profile for source inventory entry 49: Microsoft IIS; W3C extended access log"
  author: WORM Owner
spec:
  sourceCategory: server
  format: text
  match:
    contains: "- 200 0 0 1"
    regex: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\s+\S+\s+\S+\s+\S+'
  fields:
    event_message:
      from: "message"
      type: string
  map:
    event_message: event.message
  preserveUnmapped: true
