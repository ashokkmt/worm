apiVersion: worm.io/v1
kind: LogSource
metadata:
  name: market-060-arista-eos
  version: 1.0.0
  description: "Local parser profile for source inventory entry 60: Arista EOS switches; system event syslog"
  author: WORM Owner
spec:
  sourceCategory: network_device
  format: syslog
  match:
    contains: "EPROTO-5-UPD"
  fields:
    event_message:
      from: "message"
      type: string
  map:
    event_message: event.message
  preserveUnmapped: true
