apiVersion: worm.io/v1
kind: LogSource
metadata:
  name: market-064-panos-globalprotect
  version: 1.0.0
  description: "Local parser profile for source inventory entry 64: Palo Alto Networks PAN-OS; GlobalProtect authentication/gateway log CSV over syslog; explicit custom syslog CSV profile; see fixtu"
  author: WORM Owner
spec:
  sourceCategory: network_device
  format: syslog
  match:
    contains: "GLOBALPROTEC"
    regex: '^\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2},[^\"]*("[^\"]*"[^\"]*)*$'
  fields:
    event_message:
      from: "message"
      type: string
  map:
    event_message: event.message
  preserveUnmapped: true
