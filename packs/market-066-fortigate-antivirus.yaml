apiVersion: worm.io/v1
kind: LogSource
metadata:
  name: market-066-fortigate-antivirus
  version: 1.0.0
  description: "Local parser profile for source inventory entry 66: Fortinet FortiGate FortiOS 7.4; antivirus/virus UTM event key=value log"
  author: WORM Owner
spec:
  sourceCategory: network_device
  format: text
  match:
    contains: "=\"infected\""
  fields:
    event_message:
      from: "message"
      type: string
    src:
      from: "srcip"
      type: ip
    dst:
      from: "dstip"
      type: ip
    event_action:
      from: "action"
      type: string
    sample_validation_66:
      from: "date"
      type: timestamp
      required: true
      layout: "2006-01-02"
  map:
    event_message: event.message
    src: event.src_endpoint.ip
    dst: event.dst_endpoint.ip
    event_action: event.action
  preserveUnmapped: true
