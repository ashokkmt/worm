apiVersion: worm.io/v1
kind: LogSource
metadata:
  name: market-071-gcp-data-audit
  version: 1.0.0
  description: "Local parser profile for source inventory entry 71: Google Cloud; Cloud Audit Logs Data Access event JSON"
  author: WORM Owner
spec:
  sourceCategory: cloud
  format: json
  match:
    contains: "\"bucket_name\":"
  fields:
    event_time:
      from: "timestamp"
      type: timestamp
  map:
    event_time: event.time
  preserveUnmapped: true
