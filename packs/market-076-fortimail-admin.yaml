apiVersion: worm.io/v1
kind: LogSource
metadata:
  name: market-076-fortimail-admin
  version: 1.0.0
  description: "Local parser profile for source inventory entry 76: Fortinet FortiMail appliance/VM 7.x; administrator login key=value event syslog"
  author: WORM Owner
spec:
  sourceCategory: network_device
  format: text
  match:
    contains: "=0001001623"
  fields:
    event_message:
      from: "message"
      type: string
    event_action:
      from: "action"
      type: string
    sample_validation_76:
      from: "date"
      type: timestamp
      required: true
      layout: "2006-01-02"
  map:
    event_message: event.message
    event_action: event.action
  preserveUnmapped: true
