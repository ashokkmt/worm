apiVersion: worm.io/v1
kind: LogSource
metadata:
  name: market-078-mikrotik-firewall
  version: 1.0.0
  description: "Local parser profile for source inventory entry 78: MikroTik RouterOS 7; firewall topic text over RFC3164 syslog (CEF excluded from this fixture)"
  author: WORM Owner
spec:
  sourceCategory: network_device
  format: syslog
  match:
    contains: "forward:"
  fields:
    event_message:
      from: "message"
      type: string
  map:
    event_message: event.message
  preserveUnmapped: true
