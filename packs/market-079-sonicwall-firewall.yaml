apiVersion: worm.io/v1
kind: LogSource
metadata:
  name: market-079-sonicwall-firewall
  version: 1.0.0
  description: "Local parser profile for source inventory entry 79: SonicWall SonicOS 7; firewall event syslog with documented event IDs and tag fields"
  author: WORM Owner
spec:
  sourceCategory: network_device
  format: syslog
  match:
    contains: "rcvd=200"
  fields:
    event_message:
      from: "message"
      type: string
  map:
    event_message: event.message
  preserveUnmapped: true
