apiVersion: worm.io/v1
kind: LogSource
metadata:
  name: market-092-nats-server
  version: 1.0.0
  description: "Local parser profile for source inventory entry 92: NATS Server 2.x; standard timestamped text diagnostics (corrected from JSON claim)"
  author: WORM Owner
spec:
  sourceCategory: server
  format: text
  match:
    contains: "Listening"
    regex: '^\[\d+\] \d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}\.\d+ \[INF\]'
  fields:
    event_message:
      from: "message"
      type: string
  map:
    event_message: event.message
  preserveUnmapped: true
