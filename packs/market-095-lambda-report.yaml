apiVersion: worm.io/v1
kind: LogSource
metadata:
  name: market-095-lambda-report
  version: 1.0.0
  description: "Local parser profile for source inventory entry 95: AWS Lambda; REPORT platform log text delivered through CloudWatch; application stdout excluded"
  author: WORM Owner
spec:
  sourceCategory: cloud
  format: text
  match:
    contains: "Duration:"
    regex: '^REPORT RequestId:\s+[a-fA-F0-9-]+\tDuration:'
  fields:
    event_message:
      from: "message"
      type: string
  map:
    event_message: event.message
  preserveUnmapped: true
