apiVersion: worm.io/v1
kind: LogSource
metadata:
  name: market-096-azure-firewall-network
  version: 1.0.0
  description: "Local parser profile for source inventory entry 96: Azure Firewall; structured resource-specific network/application rule log JSON rows"
  author: WORM Owner
spec:
  sourceCategory: cloud
  format: json
  match:
    contains: "\"SourceIp\":"
  fields:
    event_message:
      from: "Action"
      type: string
    event_time:
      from: "TimeGenerated"
      type: timestamp
    src:
      from: "SourceIp"
      type: ip
    dst:
      from: "DestinationIp"
      type: ip
    src_port:
      from: "SourcePort"
      type: integer
    dst_port:
      from: "DestinationPort"
      type: integer
    event_action:
      from: "Action"
      type: string
  map:
    event_message: event.activity_name
    event_time: event.time
    src: event.src_endpoint.ip
    dst: event.dst_endpoint.ip
    src_port: event.src_endpoint.port
    dst_port: event.dst_endpoint.port
    event_action: event.action
  preserveUnmapped: true
