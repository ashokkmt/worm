apiVersion: worm.io/v1
kind: LogSource
metadata:
  name: market-098-gcp-cloud-armor
  version: 1.0.0
  description: "Local parser profile for source inventory entry 98: Google Cloud Armor; HTTP load balancer request security log JSON"
  author: WORM Owner
spec:
  sourceCategory: cloud
  format: json
  match:
    contains: "\"priority\":"
  fields:
    event_time:
      from: "timestamp"
      type: timestamp
  map:
    event_time: event.time
  preserveUnmapped: true
