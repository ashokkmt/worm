apiVersion: worm.io/v1
kind: LogSource
metadata:
  name: market-109-windows-special-privileges
  version: 1.0.0
  description: "Local parser profile for source inventory entry 109: Microsoft Windows Security Auditing; Event 4672 special privileges assigned XML event"
  author: WORM Owner
spec:
  sourceCategory: os
  format: xml
  match:
    contains: "Name=\"Privi"
  fields:
    sample_validation_109:
      from: "System.EventID"
      type: integer
      required: true
  preserveUnmapped: true
