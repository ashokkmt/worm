apiVersion: worm.io/v1
kind: LogSource
metadata:
  name: market-111-pfsense-filterlog
  version: 1.0.0
  description: "Local parser profile for source inventory entry 111: Netgate pfSense CE/Plus; IPv4/TCP filterlog CSV over syslog (replaces duplicate IOS XE entry)"
  author: WORM Owner
spec:
  sourceCategory: network_device
  format: syslog
  match:
    contains: "1000000103"
    regex: '^5,,,\d+,[^,]+,match,(block|pass),.*,,mss$'
  fields:
    event_message:
      from: "message"
      type: string
  map:
    event_message: event.message
  preserveUnmapped: true
