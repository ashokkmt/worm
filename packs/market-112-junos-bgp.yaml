apiVersion: worm.io/v1
kind: LogSource
metadata:
  name: market-112-junos-bgp
  version: 1.0.0
  description: "Local parser profile for source inventory entry 112: Juniper Junos; BGP neighbor state transition system syslog"
  author: WORM Owner
spec:
  sourceCategory: network_device
  format: syslog
  match:
    contains: "RPD_BGP_NEI"
  fields:
    event_message:
      from: "message"
      type: string
  map:
    event_message: event.message
  preserveUnmapped: true
