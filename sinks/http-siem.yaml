apiVersion: worm.io/v1
kind: Sink
metadata:
  name: siem-events
  version: 1.0.0
  description: HTTP SIEM delivery sink for enterprise event ingest
spec:
  type: http_output
  enabled: false
  delivery:
    format: ndjson
    batchEvents: 500
    flushInterval: 1s
    retry:
      maxAttempts: 3
      minBackoff: 250ms
      maxBackoff: 30s
  endpoint:
    url: http://127.0.0.1:8080/events
    timeout: 10s
    authHeader: Authorization
    secretRef: siem-http-token
