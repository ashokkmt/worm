apiVersion: worm.io/v1
kind: Sink
metadata:
  name: local-parquet-lake
  version: 1.0.0
  description: Parquet columnar data lake output partitioned by date and category
spec:
  type: parquet_output
  enabled: true
  path: /tmp/worm/lake
  partitionBy:
    - event_date
    - category_name
  maxRowsPerFile: 100000
  compression: zstd
  manifest: true
